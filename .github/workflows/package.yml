name: Empaquetado

# The installers, built without publishing anything, when a change touches the host or the packaging: the
# Release would fail with it otherwise only on the day of the tag. They are kept a few days to try them.
on:
  pull_request:
    paths:
      - src/host/**
      - scripts/build-core.mjs
      - scripts/version.mjs
      - .github/workflows/package.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Instaladores (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundles: src/host/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: src/host/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: ""
            bundles: |
              src/host/target/release/bundle/appimage/*.AppImage
              src/host/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/host
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Construir los instaladores
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 5
