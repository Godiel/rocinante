name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Núcleo .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Formato
        run: dotnet format src/core/Rocinante.slnx --verify-no-changes
      - name: Compilar
        run: dotnet build src/core/Rocinante.slnx --configuration Release
      - name: Tests
        run: dotnet test src/core/Rocinante.slnx --configuration Release --no-build

  ui:
    name: Interfaz React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Formato
        run: npm run format:check -w @rocinante/ui
      - name: Lint
        run: npm run lint -w @rocinante/ui
      - name: Tipos y compilación
        run: npm run build -w @rocinante/ui

  host:
    name: Anfitrión Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/host
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Publicar núcleo como sidecar
        run: npm run core:build
      - name: Compilar interfaz
        run: npm run build -w @rocinante/ui
      - name: Formato
        working-directory: src/host
        run: cargo fmt --check
      - name: Clippy
        working-directory: src/host
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src/host
        run: cargo test --locked
